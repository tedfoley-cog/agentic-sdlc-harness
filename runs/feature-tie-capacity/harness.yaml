repo: tedfoley-cog/adms-test-automation-demo
default_branch: main
commands:
  build: npm --prefix console ci --no-audit --no-fund && npm --prefix console run
    build
  test: pytest backend -q
  lint: ruff check backend
requirement_id_pattern: (?:REQ|DEF)-[A-Z]+-\d{1,3}
safety_classification: safety-critical
protected_paths:
- pattern: backend/app/flisr.py
  reviewers: 2
  reason: isolation / restoration logic
- pattern: firmware/src/**
  reviewers: 2
  reason: protection firmware
standards:
  provider: markdown
  location: standards
  required:
  - STD-GOV
  - STD-SAFETY
  by_stage:
    specify:
    - STD-REQ
    design:
    - STD-ARCH
    architect:
    - STD-ARCH
    coding:
    - STD-CODE
    fix:
    - STD-CODE
    qa:
    - STD-QA
    document:
    - STD-DOC
    explore:
    - STD-RCA
    evaluate:
    - STD-RCA
    review:
    - STD-RCA
instructions:
- .agents/skills/safety-critical-change/SKILL.md
- DEMO_NOTES.md
boundaries:
  coding:
    allowed:
    - backend/app/flisr.py
    - backend/tests/**
    forbidden:
    - backend/app/models.py
    - firmware/**
    - legacy/**
  fix:
    allowed:
    - backend/app/flisr.py
    - backend/tests/**
    forbidden:
    - backend/app/models.py
    - firmware/**
    - legacy/**
  document:
    allowed:
    - docs/**
    - README.md
layers:
  models:
  - backend/app/models.py
  logic:
  - backend/app/flisr.py
  - backend/app/state_estimator.py
  - backend/app/agc.py
  - backend/app/network.py
  - backend/app/savecase.py
  api:
  - backend/app/api.py
  ui:
  - console/**
  visibility:
    api:
    - logic
    - models
    logic:
    - models
    ui:
    - api
loops:
  architect: 5
  qa: 2
  rca: 2
models:
  default: normal
  coding: normal
  qa: ultra
  evaluate: ultra
gates:
  provider: file
  repo: tedfoley-cog/adms-test-automation-demo
  approve_label: gate:approved
  reject_label: gate:rejected
  min_reviewers: 1
governance:
  branch_prefix: agent/
  draft_only: true
  pr_label: ai-generated
  trailer: AI-Governance
checks:
  model_globs:
  - '**/models.py'
rca:
  fix_files:
  - backend/app/flisr.py
  - backend/tests/**
release:
  enabled: false
limits:
  max_acu_per_stage: 15
