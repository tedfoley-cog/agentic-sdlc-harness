[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-sdlc-harness"
version = "0.1.0"
description = "Repo-agnostic agentic SDLC mechanism: Devin orchestrator, stage skills, human gates, trace, audit, KPIs"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "jsonschema>=4.20"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
harness = "agentic_sdlc.cli:main"

[tool.setuptools.packages.find]
where = ["harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["harness", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
